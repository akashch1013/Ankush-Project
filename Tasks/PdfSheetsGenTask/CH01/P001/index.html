<h1 class="ttl">The Street That Would Not Light</h1>

<div class="cap"><p>The work lamp lights only a small circle of Lantern Street. Tall arches stretch across the lane, but their lanterns are dark. On either side stand blue-painted stalls with closed shutters.</p></div>
