<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChandRush CH01 P033</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/kit.css">
<style>
  /* page-specific placement and theme overrides only; reusable styles belong in design/base.css */
</style>
</head>
<body>
<div class="page ledger" id="page" data-chapter="CH01" data-page="P033">

  <!-- Build the page from its art-direction brief (pages.json "art"), ART-DIRECTION.md and the kit
       (kit.css; snippets in design/kit-gallery-1.html and kit-gallery-2.html). patterns.md grids are optional starting points.
       Place blocks with class="abs" and inline left/top/width/height in pt (sheet = 864 x 648 pt).
       Every printed equation carries data-math="..." (see pipeline/mathcheck.py). -->

</div>
<script>
  /* screen only: scale the 12x9 in sheet to fit the window; printing ignores this */
  (function () {
    var p = document.getElementById("page");
    function fit() {
      p.style.zoom = 1;
      var s = Math.min(document.documentElement.clientWidth / p.offsetWidth, window.innerHeight / p.offsetHeight);
      p.style.zoom = s;
    }
    if (window.matchMedia && !window.matchMedia("print").matches) { window.addEventListener("resize", fit); fit(); }
  })();
</script>
</body>
</html>
