name: Studio build

# Every push to master (a merged PR) builds and publishes a release. The version is the next patch after the
# newest studio-v* tag, or studio/package.json's version when that is higher (bump it there for a minor/major).
# Pull requests only build. Pushing a studio-vX.Y.Z tag by hand still releases exactly that version.
on:
  push:
    branches: [master]
    tags: ['studio-v*']
  pull_request:
    paths: ['studio/**', '.claude/**', 'Tasks/pipeline/**', 'Tasks/*.md', '.github/workflows/studio-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: studio/package.json
          sparse-checkout-cone-mode: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p "require('./studio/package.json').version")
          release=false
          if [[ "$GITHUB_REF" == refs/tags/studio-v* ]]; then
            v=${GITHUB_REF#refs/tags/studio-v}; release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | sed -n 's/^studio-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -1)
            last=${last:-0.0.0}
            if [ "$pkg" != "$last" ] && [ "$(printf '%s\n%s\n' "$pkg" "$last" | sort -V | tail -1)" = "$pkg" ]; then
              v=$pkg
            else
              IFS=. read -r a b c <<< "$last"; v="$a.$b.$((c + 1))"
            fi
            release=true
          else
            v=$pkg
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Studio version $v (release: $release)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            files: studio/dist/*.AppImage
          - os: windows-latest
            script: dist:win
            files: studio/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        # Full checkout: scripts/kit.mjs bundles the pipeline, skills and references into the app.
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Unit tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Set version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ChandRush Studio ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
