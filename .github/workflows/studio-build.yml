name: Studio build

on:
  push:
    branches: [master]
    tags: ['studio-v*']
    paths: ['studio/**', '.github/workflows/studio-build.yml']
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            files: studio/dist/*.AppImage
          - os: windows-latest
            script: dist:win
            files: studio/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            studio
            .github

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Unit tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/studio-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
